# Update UniDock: installs a newer release into this copy of UniDock.
#
# Start it from GitHub: Actions → Update UniDock → Run workflow. (Admins get a
# link to this page from the update notice inside UniDock.) It replaces UniDock's
# files with the release's and pushes, then Vercel redeploys. Before changing the
# database, the deploy saves a snapshot of your data.
#
# - Your data is safe: it lives in Supabase, not in these files.
# - Kept as they are: this copy's GitHub workflows (GitHub does not let this action
#   change them), public/logo.png and public/logo-dark.png, and any path listed
#   in a .unidock-keep file (one per line).
# - Changes you made to UniDock's code yourself are replaced. If you change the
#   code, fork UniDock instead and use GitHub's "Sync fork".
name: Update UniDock

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to install, for example 1.1.0. Leave empty for the newest.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-unidock
  cancel-in-progress: false

jobs:
  update:
    # The official repository publishes releases; it never updates itself.
    if: github.repository != 'nabilsajid/UniDock'
    runs-on: ubuntu-latest
    env:
      UPSTREAM: ${{ vars.UNIDOCK_UPSTREAM || 'nabilsajid/UniDock' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the version
        id: pick
        env:
          WANTED: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./package.json').version")
          if [ -n "$WANTED" ]; then
            target="${WANTED#v}"
          else
            target=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
            target="${target#v}"
          fi
          if ! echo "$target" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not find a release to install (got '$target')."
            exit 1
          fi
          newer=$(node -e '
            const p = (v) => v.split(".").map(Number);
            const [a, b] = [p(process.argv[1]), p(process.argv[2])];
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) { console.log(a[i] > b[i] ? "yes" : "no"); process.exit(0); }
            console.log("no");
          ' "$target" "$current")
          if [ "$newer" != "yes" ]; then
            echo "::notice::You already have UniDock $current; $target is not newer. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${target%%.*}" != "${current%%.*}" ]; then
            echo "::warning::$current → $target is a major update. Read the upgrade steps in the release notes."
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Bring in the release
        if: steps.pick.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.pick.outputs.target }}
          CURRENT: ${{ steps.pick.outputs.current }}
        run: |
          git config user.name "UniDock updater"
          git config user.email "updater@users.noreply.github.com"
          git fetch --no-tags --depth=1 "https://github.com/$UPSTREAM.git" "refs/tags/v$TARGET:refs/tags/unidock-v$TARGET"

          # What to keep from this copy.
          keep=".github/workflows public/logo.png public/logo-dark.png .unidock-keep"
          if [ -f .unidock-keep ]; then
            keep="$keep $(grep -v '^\s*#' .unidock-keep | grep -v '^\s*$' | tr '\n' ' ')"
          fi

          # Take the release's files (files it no longer has are removed) ...
          git read-tree -u --reset "unidock-v$TARGET"
          # ... then put back what this copy keeps.
          for path in $keep; do
            git rm -r -q --cached --ignore-unmatch -- "$path"
            rm -rf -- "$path"
            if git cat-file -e "HEAD:$path" 2>/dev/null; then git checkout HEAD -- "$path"; fi
          done

          if ! git diff --quiet HEAD "unidock-v$TARGET" -- .github/workflows; then
            echo "::warning::This release changes GitHub workflows, which this action cannot update. Copy them from https://github.com/$UPSTREAM/tree/v$TARGET/.github/workflows if you use them."
          fi

          git add -A
          git commit -q -m "Update UniDock from $CURRENT to $TARGET" -m "Release notes: https://github.com/$UPSTREAM/releases/tag/v$TARGET"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "### UniDock $CURRENT → $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed. Your host (for example Vercel) now redeploys; a snapshot of your data is taken before the database is updated." >> "$GITHUB_STEP_SUMMARY"
